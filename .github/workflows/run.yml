name: Auto Renew (Visual Debug)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  debug_screenshots:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 安装字体 (必须保留，防止乱码)
    - name: Install System Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install playwright pyotp
        playwright install chromium

    - name: Run script
      env:
        DIS_EMAIL: ${{ secrets.DIS_EMAIL }}
        DIS_PASSWORD: ${{ secrets.DIS_PASSWORD }}
        DIS_SECRET: ${{ secrets.DIS_SECRET }}
      run: python -u main.py

    # 🔥🔥🔥 关键修改：无论成功失败，都上传所有 PNG 图片 🔥🔥🔥
    - name: Upload Debug Screenshots
      if: always() # 即使脚本报错退出，也会运行这一步
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshots
        path: *.png # 上传当前目录下所有的 png 图片
        retention-days: 3
