name: Auto Renew Server (Debug)

on:
  workflow_dispatch: # 允许手动运行
  schedule:
    - cron: '0 1 * * *' # 每天自动运行

jobs:
  debug_run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install playwright pyotp
        playwright install chromium

    - name: Run script
      env:
        DIS_EMAIL: ${{ secrets.DIS_EMAIL }}
        DIS_PASSWORD: ${{ secrets.DIS_PASSWORD }}
        DIS_SECRET: ${{ secrets.DIS_SECRET }}
      run: python main.py

    # 🔥🔥🔥 新增步骤：上传错误截图 🔥🔥🔥
    - name: Upload error screenshot
      if: failure()  # ⚠️ 重要：只有当上面的步骤失败（变红）时才运行这一步
      uses: actions/upload-artifact@v4
      with:
        name: error-evidence # 上传后的压缩包名字
        path: error_screenshot.png # 要上传的文件名
        retention-days: 3 # 文件只保留3天
