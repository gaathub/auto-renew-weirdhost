name: Auto Renew Server (Font Fix)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  fix_font_run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- 🔥 核心修改：安装中日韩字体 ---
    - name: Install System Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install playwright pyotp
        playwright install chromium

    - name: Run script
      env:
        DIS_EMAIL: ${{ secrets.DIS_EMAIL }}
        DIS_PASSWORD: ${{ secrets.DIS_PASSWORD }}
        DIS_SECRET: ${{ secrets.DIS_SECRET }}
      run: python -u main.py

    - name: Upload error screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-evidence
        path: error_screenshot.png
        retention-days: 3
